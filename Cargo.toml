[package]
name = "mail-cli"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
ratatui = "0.26"
crossterm = { version = "0.27", features = ["events"] }
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "builder", "smtp-transport"] }
thiserror = "1.0"
imap = "3.0.0-alpha.15"
native-tls = "0.2"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
chrono = "0.4"
toml = "0.8"
